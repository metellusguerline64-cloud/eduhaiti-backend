name: Provision EduHaiti organizations

on:
  repository_dispatch:
    types: [eduhaiti-school-provisioning]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      org_id:
        description: "Optional organization ID to provision (for example MT6690)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eduhaiti-school-provisioning
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare the organization without deploying the Worker
        run: npm run provision:pending -- --prepare-only
        env:
          PROVISION_ORG_ID: ${{ github.event.client_payload.orgId || inputs.org_id || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_TARGET_HOST: ${{ vars.PAGES_TARGET_HOST }}
